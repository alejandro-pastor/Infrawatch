global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: 'fastapi-app'
    scrape_interval: 15s
    static_configs:
      - targets: ['api:8000']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
