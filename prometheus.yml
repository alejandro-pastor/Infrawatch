global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager-1:9093
            - alertmanager-2:9093

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: 'fastapi-app'
    scrape_interval: 15s
    static_configs:
      - targets: ['api:8000']

  - job_name: 'alertmanager'
    static_configs:
      - targets:
          - alertmanager-1:9093
          - alertmanager-2:9093

  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
